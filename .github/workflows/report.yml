name: Progress report

# The ROMs cannot be put on GitHub, so the objdiff-format reports are generated locally with
#   python tools/report.py --version us      (and --version jp)
# after `python tools/build.py` prints MATCH, and committed. This job publishes them as the artifacts
# `us_report`, `jp_report` (assembly) and `us_c_report`, `jp_c_report` (C lifting: routines whose lifted C matches the 6502 code on random states) that ByteMatch (https://bytematch.dev/) reads from CI runs on master.
# The reports contain only routine names, addresses, sizes and match percentages (no game bytes).
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [us, jp, us_c, jp_c]
    env:
      VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the report
        run: python3 -c "import json,sys; r=json.load(open('progress/${VERSION}/report.json')); m=r['measures']; print(m['matched_functions'], 'of', m['total_functions'], 'routines,', m['matched_code_percent'], '% of code matched')"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VERSION }}_report
          path: progress/${{ env.VERSION }}/report.json
