# Linker config for Golgo 13: Top Secret Episode (USA) - MMC1, 8x16KB PRG, 128KB CHR
# Banks 0-6 are switchable at $8000; bank 7 is fixed at $C000 (holds the vectors).
MEMORY {
    ZP:   start = $00,   size = $100, type = rw, file = "";
    RAM:  start = $0200, size = $600, type = rw, file = "";
    HDR:  start = $0000, size = $10,  type = ro, file = %O, fill = yes;
    PRG0: start = $8000, size = $4000, type = ro, file = %O, fill = yes;
    PRG1: start = $8000, size = $4000, type = ro, file = %O, fill = yes;
    PRG2: start = $8000, size = $4000, type = ro, file = %O, fill = yes;
    PRG3: start = $8000, size = $4000, type = ro, file = %O, fill = yes;
    PRG4: start = $8000, size = $4000, type = ro, file = %O, fill = yes;
    PRG5: start = $8000, size = $4000, type = ro, file = %O, fill = yes;
    PRG6: start = $8000, size = $4000, type = ro, file = %O, fill = yes;
    PRG7: start = $C000, size = $4000, type = ro, file = %O, fill = yes;
    CHR:  start = $0000, size = $20000, type = ro, file = %O, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    OAM:      load = RAM, type = bss, start = $200, optional = yes;
    BSS:      load = RAM, type = bss;
    HEADER:   load = HDR, type = ro;
    PRG_BANK_0: load = PRG0, type = ro, start = $8000;
    PRG_BANK_1: load = PRG1, type = ro, start = $8000;
    PRG_BANK_2: load = PRG2, type = ro, start = $8000;
    PRG_BANK_3: load = PRG3, type = ro, start = $8000;
    PRG_BANK_4: load = PRG4, type = ro, start = $8000;
    PRG_BANK_5: load = PRG5, type = ro, start = $8000;
    PRG_BANK_6: load = PRG6, type = ro, start = $8000;
    PRG_BANK_7: load = PRG7, type = ro, start = $C000;
    TILES:    load = CHR, type = ro;
}
